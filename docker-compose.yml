# DDoS Research — Local Stack
# Postgres + nginx Docker'da, NestJS native (npm run start:dev) host'ta çalışıyor.
# Bu setup hızlı iteration için: NestJS'i restart etmeden hot-reload kullanırsın.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ddos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: ddos_research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: ddos_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/logs:/var/log/nginx
    extra_hosts:
      # Linux'ta host'a erişim için (Mac/Windows zaten otomatik)
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
