# nginx config — DDoS Research Project
# Bu dosya production-grade değil, research-grade. Slow-attack experimentlerinin
# realistic davranmasi için timeout'lar production-default'larda tutuldu.
#
# NestJS upstream'i 127.0.0.1:3000'de varsayılıyor. Path'leri kendi kurulumuna göre
# güncelle.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ---------------- LOG FORMAT (ddos_research) ----------------
    # Tasarım kararları:
    # - escape=json: JSON-safe escape, downstream Python parse'ı temiz olsun.
    # - $msec: epoch.ms — t_recv_start için. NestJS interceptor da kendi
    #   t_recv'ini header'a koyacak; offset hesabı için.
    # - $request_time: nginx ilk byte'tan response'un son byte'ına kadar geçen
    #   süre. Slow-loris/slow-POST'ta bu süre $upstream_connect_time'dan ÇOK
    #   yüksek olur — bu farkı feature olarak kullanacağız.
    # - $upstream_*_time'lar: NestJS'e ne kadar zaman harcandı vs client ile
    #   ne kadar zaman harcandı ayrımını sağlar.
    # - $connection, $connection_requests: connection-level aggregation key.
    # - $bytes_received, $request_length: client'tan alınan toplam byte;
    #   inbound_byte_rate = $request_length / $request_time için kritik.
    # - $sent_http_x_*: NestJS interceptor'ın response header'a koyduğu
    #   backend cost ve metadata. Bunlar proxy_hide_header ile client'a
    #   gizlenecek ama nginx access log'una yazılacak.
    #
    # NOT: $http_cookie LOG'A YAZILMIYOR (PII riski). Sadece NestJS tarafında
    # session_id_hash hesaplanıp X-Session-Id-Hash header'ı olarak geri dönecek.

    log_format ddos_research escape=json
        '{'
            '"t_recv_start":"$msec",'
            '"request_time":"$request_time",'
            '"upstream_connect_time":"$upstream_connect_time",'
            '"upstream_header_time":"$upstream_header_time",'
            '"upstream_response_time":"$upstream_response_time",'

            '"connection":"$connection",'
            '"connection_requests":"$connection_requests",'
            '"connection_active":"$connections_active",'

            '"bytes_sent":"$bytes_sent",'
            '"body_bytes_sent":"$body_bytes_sent",'
            '"request_length":"$request_length",'

            '"remote_addr":"$remote_addr",'
            '"remote_port":"$remote_port",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'

            '"server_protocol":"$server_protocol",'
            '"scheme":"$scheme",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"args_len":"$args",'

            '"status":"$status",'
            '"http_user_agent":"$http_user_agent",'
            '"http_referer":"$http_referer",'
            '"http_accept":"$http_accept",'
            '"http_accept_language":"$http_accept_language",'
            '"http_accept_encoding":"$http_accept_encoding",'
            '"cookie_present":"$cookie_presence",'

            '"ssl_protocol":"$ssl_protocol",'
            '"ssl_cipher":"$ssl_cipher",'

            '"x_route_template":"$sent_http_x_route_template",'
            '"x_db_query_count":"$sent_http_x_db_query_count",'
            '"x_db_total_time_ms":"$sent_http_x_db_total_time_ms",'
            '"x_cpu_time_ms":"$sent_http_x_cpu_time_ms",'
            '"x_external_call_count":"$sent_http_x_external_call_count",'
            '"x_session_id_hash":"$sent_http_x_session_id_hash",'
            '"x_login_present":"$sent_http_x_login_present",'
            '"x_t_recv":"$sent_http_x_t_recv",'
            '"x_t_handler_start":"$sent_http_x_t_handler_start",'
            '"x_t_handler_end":"$sent_http_x_t_handler_end"'
        '}';

    # cookie presence flag (cookie değerini loglamıyoruz)
    map $http_cookie $cookie_presence {
        default "0";
        "~.+"   "1";
    }

    # ---------------- TIMEOUT SETTINGS ----------------
    # Slow-attack experimentleri için production-realistic değerler.
    # AGGRESIVE düşürme YAPMA — saldırıyı çok hızlı drop edersek
    # behavioral signal toplayamayız.
    client_header_timeout       60s;
    client_body_timeout         60s;
    send_timeout                60s;
    keepalive_timeout           75s;
    keepalive_requests          1000;

    # NOT: production'da reset_timedout_connection on; olur, biz off bırakıyoruz
    # ki slow-loris aldığı timeout'la 408 dönsün, ham TCP RST atmasın.
    reset_timedout_connection   off;

    # ---------------- PERFORMANCE / BUFFER ----------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    types_hash_max_size 2048;

    # ---------------- LOG OUTPUT ----------------
    # Research için buffer kapalı: gerçek timestamp sırası kayıtlı kalsın.
    # Production'da buffer açılır, biz açmıyoruz.
    # 1. access_log satırı — buffer=0 flush=1s yerine sadece flush=1s
    access_log /var/log/nginx/ddos_research.log ddos_research;
    error_log  /var/log/nginx/ddos_research_error.log warn;

    # ---------------- UPSTREAM (NestJS) ----------------
    # NestJS native (npm run start:dev) host machine'de :3000'de.
    # nginx Docker container'da olduğu için host'a host.docker.internal ile erişiyor.
    # Mac/Windows Docker Desktop'ta bu çalışır. Linux'ta extra_hosts ile mapping
    # docker-compose.yml'de yapıldı.
    upstream nestjs_app {
        server host.docker.internal:3000;
        # Connection reuse kapalı bırakıyoruz: her request için fresh upstream
        # connection; backend cost ölçümü temiz olsun.
        # keepalive direktifi yok = connection pool yok, her request'te fresh conn
    }

    server {
        listen 80;
        server_name _;

        # SSL v1'de yok — local research için friction; v2'de JA3 ile birlikte
        # gelecek.

        # NestJS'e proxy
        location / {
            proxy_pass         http://nestjs_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Connection-Id   $connection;
            proxy_set_header   X-Connection-Req  $connection_requests;
            proxy_set_header   X-Recv-Start      $msec;

            # NestJS internal header'lar nginx tarafından LOG'A yazılır,
            # client'a gizlenir.
            proxy_hide_header  X-Route-Template;
            proxy_hide_header  X-DB-Query-Count;
            proxy_hide_header  X-DB-Total-Time-Ms;
            proxy_hide_header  X-CPU-Time-Ms;
            proxy_hide_header  X-External-Call-Count;
            proxy_hide_header  X-Session-Id-Hash;
            proxy_hide_header  X-Login-Present;
            proxy_hide_header  X-T-Recv;
            proxy_hide_header  X-T-Handler-Start;
            proxy_hide_header  X-T-Handler-End;
        }
    }
}

# ---------------- NOT NOTLAR ----------------
# 1. JA3/JA4 v2 scope'unda. Şu an log'lamiyoruz; eklemek istersen
#    nginx-ssl-ja3 / haproxy-ja3 modülü gerek (recompile).
#
# 2. HTTP/2 v1'de aktif değil (server protocol HTTP/1.1). Slow-loris
#    HTTP/1.1 senaryosuna odaklı. HTTP/2 Rapid Reset ayrı tezdir.
#
# 3. nginx connection log SEPARATE değil; access_log her request için yazıyor.
#    Connection-level feature'ları offline derlerken (conn_id, MIN(t_recv_start),
#    MAX(t_response_complete)) ile rebuild edeceğiz. Ayrı connection log
#    açmanın avantajı az, complexity çok.
#
# 4. Partial request'ler: slow-loris ile timeout olan request nginx tarafından
#    status=408 ile loglanır. Bu offline'da partial_request_flag = (status IN
#    (408, 400, 444, 499)) olarak feature olur.
#
# 5. Log rotation: deney sırasında ROTATE ETME. logrotate cronu deney saatleri
#    dışına al, ya da deney boyunca kapat.
