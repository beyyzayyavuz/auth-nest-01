# nginx config — DDoS Research Project
# Bu dosya production-grade değil, research-grade. Slow-attack experimentlerinin
# realistic davranmasi için timeout'lar production-default'larda tutuldu.
#
# NestJS upstream'i 127.0.0.1:3000'de varsayılıyor. Path'leri kendi kurulumuma göre
# güncelliyorum ve güncelledim.

# Beyza not: Her dosya bir bağlantıdır.

worker_processes auto; # Benim bilgisayarımda kaç çekirdek işlemci varsa, o kadar işçi çalıştırmam lazım.
worker_rlimit_nofile 65535; # Bilgisayarın NGINX'e koyduğu "en fazla 1024 bağlantı açabilirsin" yasağını kaldırıp sınırı 65 bin dökümana çeker ki sistem kilitlenmesin.

events {
    # Her bir işçi aynı anda 16 bin küsur masaya (bağlantıya) birden baksın." 
    # Botlar saldırdığında sunucu "ben yoruldum, daha fazla müşteri alamam" deyip bayılmasın diye bu sayıyı yüksek tutmam gerekiyor.
    # Çok yüksek değerler koymak da mantıklı değil, çünkü her bağlantı biraz bellek kullanır. 16k, çoğu senaryo için iyi bir denge sağlar.
    worker_connections 16384; 
    multi_accept on; # Atak anında kapıda biriken yüzlerce isteği tek tek sırayla almak yerine, o saniye hepsini birden içeri dalar gibi kabul eder.
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ------------ LOG FORMAT (ddos_research) ---------
    # Tasarım kararları:
    # - escape=json: JSON-safe escape, downstream Python parse'ı temiz olsun.
    # - $msec: epoch.ms — t_recv_start için. NestJS interceptor da kendi
    #   t_recv'ini header'a koyacak; offset hesabı için.
    # - $request_time: nginx ilk byte'tan response'un son byte'ına kadar geçen
    #   süre. Slow-loris/slow-POST'ta bu süre $upstream_connect_time'dan ÇOK
    #   yüksek olur — bu farkı feature olarak kullanacağız.
    # - $upstream_*_time'lar: NestJS'e ne kadar zaman harcandı vs client ile
    #   ne kadar zaman harcandı ayrımını sağlar.
    # - $connection, $connection_requests: connection-level aggregation key.
    # - $bytes_received, $request_length: client'tan alınan toplam byte;
    #   inbound_byte_rate = $request_length / $request_time için kritik.
    # - $sent_http_x_*: NestJS interceptor'ın response header'a koyduğu
    #   backend cost ve metadata. Bunlar proxy_hide_header ile client'a
    #   gizlenecek ama nginx access log'una yazılacak.
    #
    # NOT: $http_cookie LOG'A YAZILMIYOR (PII riski). Sadece NestJS tarafında
    # session_id_hash hesaplanıp X-Session-Id-Hash header'ı olarak geri dönecek.

    log_format ddos_research escape=json
        '{'
            '"t_recv_start":"$msec",' # İstek geldiği anın milisaniyelik zamanı. Python'da iki istek arasındaki süreyi (IAT) bulmak için bunu kullanacağız.
            '"request_time":"$request_time",' # İsteğin kapıdan girip çıkana kadar NGINX'te harcadığı toplam süre. Slowloris botlarında bu süre tavan yapar.
            '"upstream_connect_time":"$upstream_connect_time",' # NGINX'in NestJS backend'e bağlanırken harcadığı süre.
            '"upstream_header_time":"$upstream_header_time",' # NestJS'in isteğin başlığını (header) cevaplayana kadar geçen süre.
            '"upstream_response_time":"$upstream_response_time",' # NestJS backend'in içeride kod çalıştırıp cevap ürettiği saf süre.

            # Beyza not: Üstteki request_time çok yüksek, upstream_response_time 0 ise bu kesin yavaş (Slowloris) ataktır de.

            '"connection":"$connection",' # Gelen her TCP bağlantısına verilen benzersiz kimlik numarası (ID).
            '"connection_requests":"$connection_requests",' # Bu ID'li hattan şu ana kadar kaç tane istek gönderildiği. Botlar tek hattan binlerce istek basabilir.
            '"connection_active":"$connections_active",' # O anda açık olan toplam bağlantı sayısı. Bot saldırısında bu sayı hızla artar.

            '"bytes_sent":"$bytes_sent",' # NGINX'ten client'a gönderilen toplam byte. Botlar genellikle çok az veri alır, bu yüzden düşük kalır.
            '"body_bytes_sent":"$body_bytes_sent",' # Kullanıcıya gönderilen cevabın gövde (içerik) boyutu.
            '"request_length":"$request_length",'  # Kullanıcının bize gönderdiği isteğin ham boyutu. Saniyede kaç byte veri gönderdiğini (inbound_byte_rate) hesaplamak için kritik.

            '"remote_addr":"$remote_addr",' # Kullanıcının IP adresi. Botlar genellikle çok sayıda farklı IP'den gelir, bu yüzden saldırı tespiti için önemli bir özelliktir.
            '"remote_port":"$remote_port",' # Kullanıcının bağlantı kurduğu port. Genellikle önemsizdir, ama bazı botlar rastgele portlardan bağlanabilir.
            '"http_x_forwarded_for":"$http_x_forwarded_for",' # Kullanıcının gerçek IP adresini içeren header. Eğer NGINX bir proxy arkasında çalışıyorsa, gerçek IP'yi almak için bu header'ı kullanırız.

            '"server_protocol":"$server_protocol",' # Kullanılan HTTP protokolü (Biz bilerek HTTP/1.1 kullandık). Peki neden?
            '"scheme":"$scheme",' # Bağlantının çeşidi (http veya https).
            '"request_method":"$request_method",' # İstek tipi (GET mi, POST mu, LOGIN mi?).
            '"request_uri":"$request_uri",' # İstek atılan sayfa veya endpoint adresi (Örn: /auth/login).
            '"args_len":"$args",' # URL'nin sonuna eklenen parametrelerin (örn: ?id=5) uzunluğu.

            '"status":"$status",' # NGINX'in isteğe verdiği HTTP durum kodu (200, 404, 408, vb.). Bot saldırılarında genellikle 408 (Request Timeout) veya 400 (Bad Request) gibi kodlar artar.
            '"http_user_agent":"$http_user_agent",' # İstek atan tarayıcı veya bot programının adı (k6 mı, python scripti mi, Chrome mu?). 
            '"http_referer":"$http_referer",' # Kullanıcının bu sayfaya hangi siteden tıklayıp geldiği.
            '"http_accept":"$http_accept",' # Tarayıcının kabul edebileceği dosya tipleri.
            '"http_accept_language":"$http_accept_language",' # Tarayıcının dil seçeneği (Botlar genelde buraları boş bırakır veya taklit eder).
            '"http_accept_encoding":"$http_accept_encoding",' # Desteklenen sıkıştırma türleri.
            '"cookie_present":"$cookie_presence",' # Kullanıcıda çerez (cookie) var mı yok mu (1 veya 0). Güvenlik (PII) riski olmasın diye çerezin içeriğini değil sadece varlığını logluyoruz.

            '"ssl_protocol":"$ssl_protocol",' # Varsa kullanılan SSL protokol sürümü.
            '"ssl_cipher":"$ssl_cipher",' # Şifreleme algoritması türü.

            '"x_route_template":"$upstream_http_x_route_template",' # NestJS'teki sayfa şablonu adı.
            '"x_db_query_count":"$upstream_http_x_db_query_count",' # Bu isteğin içeride kaç tane veritabanı sorgusu tetiklediği.
            '"x_db_total_time_ms":"$upstream_http_x_db_total_time_ms",' # Veritabanında harcanan toplam milisaniye.
            '"x_cpu_time_ms":"$upstream_http_x_cpu_time_ms",' # Bu isteği işlemek için işlemcinin (CPU) ne kadar ter döktüğü
            '"x_external_call_count":"$upstream_http_x_external_call_count",' # Dışarıdaki başka API'lere kaç çağrı yapıldığı.
            '"x_session_id_hash":"$upstream_http_x_session_id_hash",' # Kullanıcının gizliliği korunsun diye NestJS'te hash'lenen seans numarası.
            '"x_login_present":"$upstream_http_x_login_present",'  # Kullanıcı giriş yapmış birisi mi değil mi bilgisi.
            '"x_t_recv":"$upstream_http_x_t_recv",' # İsteğin NestJS katmanına ulaştığı anın zaman damgası.
            '"x_t_handler_start":"$upstream_http_x_t_handler_start",' # NestJS kodunun fonksiyonu çalıştırmaya başladığı an.
            '"x_t_handler_end":"$upstream_http_x_t_handler_end"' # Fonksiyonun işini bitirip cevabı hazırladığı an.
        '}';

    # cookie presence flag (cookie değerini loglamıyoruz)
    map $http_cookie $cookie_presence {
        default "0"; # İstek header'ında cookie yoksa 0, varsa 1 olarak loglanacak. Botlar genellikle cookie kullanmaz, bu yüzden bu özellik saldırı tespiti için faydalı olabilir.
        "~.+"   "1";
    }
    # Beyza not: Botların cookie kullanmamasına ek olarak, PII kuralları gereği cookie içeriğini loglamamam gerekiyor. Varlığını 1 ve 0 ile göstermem benim içimn yeterli.
    # PII : Personally Identifiable Information (KVKK: T.C. no, ev adresi, telefon no) — GDPR ve benzeri veri koruma yasaları kapsamında, bir bireyi doğrudan veya dolaylı olarak tanımlamak için kullanılabilecek herhangi bir bilgi. IP adresleri, çerezler, kullanıcı adları gibi bilgiler PII kategorisine girebilir ve bu tür bilgilerin loglanması veya işlenmesi özel izinler gerektirebilir.

    # ---------------- TIMEOUT SETTINGS ----------------
    # Slow-attack experimentleri için production-realistic değerler.
    # AGGRESIVE düşürme YAPMA — saldırıyı çok hızlı drop edersek
    # behavioral signal toplayamayız.
    client_header_timeout       60s; # Kullanıcı istek atarken başlığı (header) göndermek için en fazla 60 saniye bekleyebilir.
    client_body_timeout         60s; # Kullanıcı istek atarken gövdeyi (body) göndermek için en fazla 60 saniye bekleyebilir. Slow-POST saldırılarında bu süre tavan yapar.
    send_timeout                60s; # NGINX'in kullanıcıya cevap gönderirken her bir veri parçasını göndermek için en fazla 60 saniye bekleyebileceği süre. Slow-HTTP saldırılarında bu süre tavan yapar.
    keepalive_timeout           75s; # Bir bağlantının açık kalabileceği maksimum süre. Slow-attack senaryolarında bu süre tavan yapar, çünkü botlar bağlantıyı uzun süre açık tutmaya çalışır.
    keepalive_requests          1000; # Bir bağlantı üzerinden maksimum 1000 istek kabul edilir. Botlar tek bağlantı üzerinden binlerce istek atabilir, bu yüzden bu sayıyı yüksek tutuyoruz.

    # NOT: production'da reset_timedout_connection on; olur, biz off bırakıyoruz
    # ki slow-loris aldığı timeout'la 408 dönsün, ham TCP RST atmasın. Diğer bir deyişle timeout olan istekler loglanarak research için kullanılabilir olsun, saldırı tespiti için sinyal olsun istiyoruz.
    reset_timedout_connection   off;

    # ---------------- PERFORMANCE / BUFFER ----------------
    sendfile        on; # Dosya gönderirken sendfile kullanarak performansı artırır. Nasıl? sendfile, NGINX'in dosya içeriğini doğrudan diskten ağ üzerinden göndermesine olanak tanır, bu da CPU kullanımını azaltır ve veri aktarımını hızlandırır.
    tcp_nopush      on; # sendfile ile birlikte kullanılır. NGINX'in veri parçalarını mümkün olduğunca büyük bloklar halinde göndermesini sağlar, bu da ağ verimliliğini artırır.
    tcp_nodelay     on; # Verilerin mümkün olan en kısa sürede gönderilmesini sağlar. Bu, özellikle küçük veri parçaları için önemlidir, çünkü gecikmeyi azaltır.
    types_hash_max_size 2048; # NGINX'in dosya uzantılarını (MIME types) hafızada hızlıca araması için açılan tablonun maksimum boyutudur.

    # ---------------- LOG OUTPUT ----------------
    # Research için buffer kapalı: gerçek timestamp sırası kayıtlı kalsın.
    # Production'da buffer açılır, biz açmıyoruz.
    # 1. access_log satırı — buffer=0 flush=1s yerine sadece flush=1s
    access_log /var/log/nginx/ddos_research.log ddos_research; # Başarılı veya timeout alan her isteğin yazılacağı ana araştırma kütüğümüz. (Buffer kapalı, istek bittiği an sırayı bozmadan anında diske yazılır).
    error_log  /var/log/nginx/ddos_research_error.log warn; # Sistemde bir arıza veya uyarı olursa yazılacağı hata günlüğü.

    # ---------------- UPSTREAM (NestJS) ----------------
    # NestJS native (npm run start:dev) host machine'de :3000'de.
    # nginx Docker container'da olduğu için host'a host.docker.internal ile erişiyor.
    # Mac/Windows Docker Desktop'ta bu çalışır. Linux'ta extra_hosts ile mapping
    # docker-compose.yml'de yapıldı.
    upstream nestjs_app {
        server host.docker.internal:3000; # Docker içindeki NGINX'in, kendi bilgisayarımızda (host) çalışan NestJS'e ulaşmasını sağlayan kapı adresi.
        # Connection reuse kapalı bırakıyoruz: her request için fresh upstream
        # connection; backend cost ölçümü temiz olsun.
        # keepalive direktifi yok = connection pool yok, her request'te fresh conn

        # Beyza not: Burada "keepalive" komutu yok. Yani bağlantı havuzunu (connection pool) bilerek kapalı tuttuk. 
        # Her istek NestJS'e sıfırdan, yepyeni bir temiz hatla gitsin ki içeride harcanan gerçek CPU ve DB maliyetlerini (backend cost) birbirine karıştırmadan tertemiz ölçelim. ---
    }

    server {
        listen 80; # NGINX'in dış dünyayı dinlediği standart HTTP portu.
        server_name _; # Gelen istekte hangi domain yazarsa yazsın (localhost, IP vs.) hepsini kabul et demek.

        # SSL v1'de yok — local research için friction; v2'de JA3 ile birlikte
        # gelecek.

        # NestJS'e proxy
        location / {
            proxy_pass         http://nestjs_app;  # Kapıdan giren tüm trafiği yukarıda tanımladığımız NestJS uygulamasına pasla.
            proxy_http_version 1.1; # NestJS ile konuşurken HTTP/1.1 protokolünü kullan. 
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Connection-Id   $connection; # NGINX'in bu TCP hattına verdiği numarayı NestJS de bilsin diye.
            proxy_set_header   X-Connection-Req  $connection_requests; # Bu hattan kaçıncı isteğin geldiğini NestJS'e fırlatır.
            proxy_set_header   X-Recv-Start      $msec; # İsteğin NGINX'e ilk çarptığı andaki milisaniye zamanı. NestJS kendi zamanıyla bunu kıyaslayıp ağ gecikmesini bulabilir.

 
            # Beyza not: NestJS'in içeride ölçtüğü derin maliyet raporları (DB sorgu sayısı, CPU süresi vb.) 
            # NGINX loguna yazıldıktan sonra, aşağıdaki komutlarla dışarıdaki saldırgandan tamamen gizlenir. Saldırgan sistemi ne kadar yorduğunu asla göremez.
            proxy_hide_header  X-Route-Template;
            proxy_hide_header  X-DB-Query-Count;
            proxy_hide_header  X-DB-Total-Time-Ms;
            proxy_hide_header  X-CPU-Time-Ms;
            proxy_hide_header  X-External-Call-Count;
            proxy_hide_header  X-Session-Id-Hash;
            proxy_hide_header  X-Login-Present;
            proxy_hide_header  X-T-Recv;
            proxy_hide_header  X-T-Handler-Start;
            proxy_hide_header  X-T-Handler-End;
        }
    }
}

# ---------------- NOT NOTLAR ----------------
# 1. JA3/JA4 v2 scope'unda. Şu an log'lamiyoruz; eklemek istersen
#    nginx-ssl-ja3 / haproxy-ja3 modülü gerek (recompile).
#
# 2. HTTP/2 v1'de aktif değil (server protocol HTTP/1.1). Slow-loris
#    HTTP/1.1 senaryosuna odaklı. HTTP/2 Rapid Reset ayrı tezdir.
#
# 3. nginx connection log SEPARATE değil; access_log her request için yazıyor.
#    Connection-level feature'ları offline derlerken (conn_id, MIN(t_recv_start),
#    MAX(t_response_complete)) ile rebuild edeceğiz. Ayrı connection log
#    açmanın avantajı az, complexity çok.
#
# 4. Partial request'ler: slow-loris ile timeout olan request nginx tarafından
#    status=408 ile loglanır. Bu offline'da partial_request_flag = (status IN
#    (408, 400, 444, 499)) olarak feature olur.
#
# 5. Log rotation: deney sırasında ROTATE ETME. logrotate cronu deney saatleri
#    dışına al, ya da deney boyunca kapat.
